[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-chessboard"
version = "0.3.1"
description = "Asynchronous Python BLE interface for the Phantom Chessboard"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.22",
]

[project.scripts]
phantom-board = "phantom_chessboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
